name: CI técnico

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tecnico-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do carregador
        run: python -m pip install neo4j python-dotenv
      - name: Verificar sintaxe Python
        run: python -m py_compile load_graph.py
      - name: Carregar grafo e dados adicionais
        run: |
          python load_graph.py setup.cypher
          python load_graph.py seed.cypher
      - name: Verificar dados e relacionamento
        run: |
          python - <<'PY'
          from neo4j import GraphDatabase
          with GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j', 'testpassword')) as driver:
              with driver.session(database='neo4j') as session:
                  for query, expected in [
                      ('MATCH (u:User) RETURN count(u) AS total', 7),
                      ('MATCH (d:Day) RETURN count(d) AS total', 7),
                      ('MATCH (:User)-[:OWNS]->(:Property) RETURN count(*) AS total', 7),
                  ]:
                      actual = session.run(query).single()['total']
                      if actual != expected:
                          raise AssertionError(f'{query}: esperado {expected}, obtido {actual}')
          PY

  report-ci:
    name: Reportar resultado do CI na PR
    if: always() && github.event_name == 'pull_request'
    needs:
      - graph
    uses: delta-app-ofc/.github/.github/workflows/report_ci.yml@8f4329cdde8ad39527069966a5cb97bbb49675b5
    with:
      needs_results: ${{ toJSON(needs) }}
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      issues: write
      pull-requests: write
